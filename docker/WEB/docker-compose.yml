name: WEB

services:
  nginx1:
    image: nginx:1.28
    container_name: nginx1
    ports:
      - "127.0.0.1:80:80"    # IP 127.0.0.1의 80번 포트에 바인딩
    volumes:
      - ../../nginx-config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../nginx-config/static/:/usr/share/nginx/html/:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  nginx2:
    image: nginx:1.28
    container_name: nginx2
    ports:
      - "127.0.0.2:80:80"    # IP 127.0.0.2의 80번 포트에 바인딩 (포트 충돌 없음!)
    volumes:
      - ../../nginx-config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../nginx-config/static/:/usr/share/nginx/html/:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  coredns:
    image: coredns/coredns:1.12.0
    container_name: coredns
    ports:
      - "53:53/udp"           # DNS는 UDP 53번 포트
      - "53:53/tcp"
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile:ro
      - ./coredns/db.woorifisa.com:/etc/coredns/db.woorifisa.com:ro
    command: ["-conf", "/etc/coredns/Corefile"]
    restart: unless-stopped
